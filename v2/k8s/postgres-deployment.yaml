apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: pdfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "pdfs"
            - name: POSTGRES_DB
              value: "pdfs"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pdfs-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
