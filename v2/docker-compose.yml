services:
  postgresql:
    image: postgres:15-alpine
    container_name: pdfs_postgres
    environment:
      POSTGRES_USER: pdfs
      POSTGRES_PASSWORD: pdfs1234
      POSTGRES_DB: pdfs
    ports:
      - "5432:5432"
    volumes:
      - pdfs_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pdfs-network

  backend:
    build: ./backend
    container_name: pdfs_backend
    environment:
      DATABASE_URL: postgresql://pdfs:pdfs1234@postgresql:5432/pdfs
    depends_on:
      - postgresql
    restart: unless-stopped
    networks:
      - pdfs-network

  frontend:
    build: ./frontend
    container_name: pdfs_frontend
    environment:
      API_URL: http://backend:8010
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pdfs-network

  nginx:
    build: ./nginx
    container_name: pdfs_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - pdfs-network

networks:
  pdfs-network:
    driver: bridge

volumes:
  pdfs_pg_data:
