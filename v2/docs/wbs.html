* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0d1117; height:100vh; overflow:hidden; }
.wrap { display:flex; flex-direction:column; height:100vh; padding:12px 18px; gap:10px; }

/* ── 헤더 ── */
.head { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.title { font-size:17px; font-weight:900; color:#e6edf3; }
.subtitle { font-size:11px; color:#8b949e; margin-top:2px; }
.nav { display:flex; gap:5px; }
.nav-btn { font-size:11px; font-weight:700; padding:5px 14px; border-radius:20px; border:1.5px solid #30363d; background:#161b22; color:#8b949e; cursor:pointer; transition:all .15s; }
.nav-btn:hover { border-color:#58a6ff; color:#58a6ff; }
.nav-btn.active { background:#1f6feb; color:#fff; border-color:#1f6feb; }

/* ── 장면 ── */
.scene { display:none; flex:1; min-height:0; flex-direction:column; }
.scene.active { display:flex; }

/* ══ WBS 테이블 ══ */
.wbs-wrap { flex:1; min-height:0; display:flex; flex-direction:column; background:#161b22; border-radius:10px; border:1px solid #30363d; overflow:hidden; }

.wbs-filters { padding:8px 12px; background:#0d1117; border-bottom:1px solid #21262d; display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; align-items:center; }
.filter-btn { font-size:10.5px; font-weight:700; padding:3px 11px; border-radius:12px; border:1.5px solid; cursor:pointer; background:transparent; transition:all .15s; opacity:.55; }
.filter-btn:hover { opacity:.85; }
.filter-btn.f-active { opacity:1; }
.filter-btn.f-all { border-color:#30363d; color:#8b949e; }
.filter-btn.f-all.f-active { background:#21262d; }

.wbs-scroll { flex:1; overflow-y:auto; }
.wbs-scroll::-webkit-scrollbar { width:3px; }
.wbs-scroll::-webkit-scrollbar-thumb { background:#30363d; border-radius:2px; }

.wbs-table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.wbs-table th { padding:8px 12px; text-align:left; font-size:10px; font-weight:800; letter-spacing:.4px; color:#6e7681; text-transform:uppercase; background:#0d1117; border-bottom:2px solid #21262d; white-space:nowrap; position:sticky; top:0; z-index:1; }
.wbs-table td { padding:9px 12px; border-bottom:1px solid #1c2128; color:#8b949e; vertical-align:middle; overflow:hidden; }
.wbs-table tr:last-child td { border-bottom:none; }
.wbs-table tr:hover td { background:#1c2128; }

.cat-badge { font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px; white-space:nowrap; border:1.5px solid; }
.status-done { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:#0d2318; color:#3fb950; border:1px solid #1a7f37; white-space:nowrap; }
.task-name { font-weight:600; color:#c9d1d9; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.task-detail { font-size:10.5px; color:#6e7681; margin-top:2px; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.person-badge { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:8px; white-space:nowrap; }
.pri-h { color:#f85149; font-weight:700; }
.pri-m { color:#d29922; font-weight:700; }

/* ══ 간트 차트 ══ */

.gantt-header { display:flex; background:#0d1117; border-bottom:2px solid #21262d; flex-shrink:0; }
.gantt-left-head { width:250px; flex-shrink:0; padding:8px 14px; font-size:10px; font-weight:800; color:#6e7681; text-transform:uppercase; border-right:1px solid #21262d; }
.gantt-dates { flex:1; display:flex; }
.gantt-day-col { flex:1; text-align:center; padding:5px 2px; border-right:1px solid #1c2128; min-width:0; }
.gantt-day-col:last-child { border-right:none; }
.gantt-day-num { font-size:11px; font-weight:800; color:#6e7681; }
.gantt-day-name { font-size:9px; color:#484f58; margin-top:1px; }
.gantt-day-col.weekend { background:#0a0d14; }
.gantt-day-col.weekend .gantt-day-num { color:#30363d; }
.gantt-day-col.today-d { background:#1f6feb18; }
.gantt-day-col.today-d .gantt-day-num { color:#58a6ff; }

.gantt-body { flex:1; overflow-y:auto; }
.gantt-body::-webkit-scrollbar { width:3px; }
.gantt-body::-webkit-scrollbar-thumb { background:#30363d; border-radius:2px; }

.gantt-cat-sep { display:flex; background:#0d1117; border-bottom:1px solid #21262d; border-top:1px solid #21262d; }
.gantt-cat-label { width:250px; flex-shrink:0; padding:5px 14px; font-size:9px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; border-right:1px solid #21262d; display:flex; align-items:center; gap:6px; }
.gantt-cat-bg { flex:1; }

.gantt-row { display:flex; border-bottom:1px solid #1c2128; min-height:38px; }
.gantt-row:last-child { border-bottom:none; }
.gantt-row:hover .gantt-info { background:#1c2128; }
.gantt-info { width:250px; flex-shrink:0; padding:6px 14px; border-right:1px solid #21262d; display:flex; flex-direction:column; justify-content:center; gap:3px; }
.gantt-task { font-size:11px; font-weight:600; color:#c9d1d9; line-height:1.3; }
.gantt-meta { display:flex; align-items:center; gap:5px; }
.gantt-person { font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:8px; }
.gantt-sub { font-size:9px; color:#484f58; }

.gantt-timeline { flex:1; position:relative; overflow:hidden; }
.g-bg { position:absolute; top:0; bottom:0; }
.g-bg.weekend { background:#0a0d14; }
.g-bg.today-line { background:#1f6feb0c; border-right:1px dashed #1f6feb50; }
.gantt-bar { position:absolute; top:50%; transform:translateY(-50%); height:20px; border-radius:10px; display:flex; align-items:center; padding:0 8px; font-size:9px; font-weight:700; color:rgba(255,255,255,.9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 2px 8px rgba(0,0,0,.4); }

  '발표':  {bg:'#1f1a00',txt:'#ffd700',brd:'#b8860b',bar:'#c9920a'},
};

/* ── 담당자 색상 ──────────────────────────────────────── */
const persons = {
  '공통':  {bg:'#21262d',txt:'#8b949e'},
  '김응석':{bg:'#0d1825',txt:'#58a6ff'},
  '홍제규':{bg:'#0d2318',txt:'#3fb950'},
  '장영재':{bg:'#1a0d2e',txt:'#d2a8ff'},
  '안세웅':{bg:'#2a1500',txt:'#f0a040'},
  '이성룡':{bg:'#2d1010',txt:'#f85149'},
};

/* ── 간트 타임라인 세팅 ───────────────────────────────── */
const GANTT_START = new Date('2026-06-04');
const TOTAL_DAYS  = 13;
const DAY_LABELS  = ['목','금','토','일','월','화','수','목','금','토','일','월','화'];
const IS_WEEKEND  = [false,false,true,true,false,false,false,false,false,true,true,false,false];
const TODAY_IDX   = 11; // Jun 15

function dayIdx(dateStr) {
  return Math.round((new Date(dateStr) - GANTT_START) / 86400000);
}

/* ── 장면 전환 ────────────────────────────────────────── */
function show(id, btn) {
  document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (btn) btn.classList.add('active');
}

/* ── 필터 ─────────────────────────────────────────────── */
let activeCat = 'all';

function renderFilters() {
  const el = document.getElementById('filters');
  const list = ['all', ...Object.keys(cats)];
  el.innerHTML = list.map(c => {
    const isAll = c === 'all';
    const col   = cats[c];
    const cnt   = isAll ? tasks.length : tasks.filter(t => t.cat === c).length;
    const style = isAll
      ? '' : `border-color:${col.brd};color:${col.txt};`;
    const active = activeCat === c ? 'f-active' : '';
    const cls    = isAll ? 'f-all' : '';
    return `<button class="filter-btn ${cls} ${active}" style="${style}" onclick="setFilter('${c}')">`
         + `${isAll ? '전체' : c} <span style="opacity:.55">(${cnt})</span></button>`;
  }).join('');
}

function setFilter(cat) { activeCat = cat; renderFilters(); renderTable(); }

/* ── WBS 테이블 렌더 ─────────────────────────────────── */
function renderTable() {
  const rows = activeCat === 'all' ? tasks : tasks.filter(t => t.cat === activeCat);
  document.getElementById('wbs-body').innerHTML = rows.map(t => {
    const c = cats[t.cat];
    const p = persons[t.person] || {bg:'#21262d',txt:'#8b949e'};
    const priCls = t.pri === '상' ? 'pri-h' : t.pri === '중' ? 'pri-m' : '';
    return `<tr>
      <td style="color:#6e7681;font-size:11px;text-align:center">${t.id}</td>
      <td><span class="cat-badge" style="background:${c.bg};color:${c.txt};border-color:${c.brd}">${t.cat}</span></td>
      <td style="font-size:11px;color:#6e7681">${t.sub}</td>
      <td><div class="task-name">${t.task}</div><div class="task-detail">${t.detail}</div></td>
      <td><span class="person-badge" style="background:${p.bg};color:${p.txt}">${t.person}</span></td>
      <td><span class="status-done">완료</span></td>
      <td style="text-align:center"><span class="${priCls}" style="font-size:11px">${t.pri}</span></td>
      <td style="font-size:10.5px;font-family:'Consolas',monospace;color:#6e7681;white-space:nowrap">${t.s.slice(5)} ~ ${t.e.slice(5)}</td>
    </tr>`;
  }).join('');
}

/* ── 간트 차트 렌더 ──────────────────────────────────── */
function renderGantt() {
  /* 날짜 헤더 */
  document.getElementById('gantt-dates').innerHTML =
    Array.from({length: TOTAL_DAYS}, (_, i) => {
      const cls = IS_WEEKEND[i] ? 'weekend' : i === TODAY_IDX ? 'today-d' : '';
      return `<div class="gantt-day-col ${cls}">
        <div class="gantt-day-num">${4 + i}</div>
        <div class="gantt-day-name">${DAY_LABELS[i]}</div>
      </div>`;
    }).join('');

  /* 배경 열 프리컴파일 */
  const bgCols = Array.from({length: TOTAL_DAYS}, (_, i) => {
    const cls = IS_WEEKEND[i] ? 'weekend' : i === TODAY_IDX ? 'today-line' : '';
    if (!cls) return '';
    const l = (i / TOTAL_DAYS * 100).toFixed(4);
    const w = (1 / TOTAL_DAYS * 100).toFixed(4);
    return `<div class="g-bg ${cls}" style="left:${l}%;width:${w}%"></div>`;
  }).join('');

  /* 행 렌더 */
  let html = '';
  let prevCat = null;
  tasks.forEach(t => {
    const c = cats[t.cat];
    const p = persons[t.person] || {bg:'#21262d',txt:'#8b949e'};
    if (t.cat !== prevCat) {
      html += `<div class="gantt-cat-sep">
        <div class="gantt-cat-label" style="color:${c.txt}">
          <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${c.bar};flex-shrink:0"></span>
          ${t.cat}
        </div>
        <div class="gantt-cat-bg"></div>
      </div>`;
      prevCat = t.cat;
    }
    const si = dayIdx(t.s), ei = dayIdx(t.e);
    const left  = (si / TOTAL_DAYS * 100).toFixed(4);
    const width = ((ei - si + 1) / TOTAL_DAYS * 100).toFixed(4);
    const label = parseFloat(width) > 12 ? `${t.s.slice(8)}~${t.e.slice(8)}` : '';
    html += `<div class="gantt-row">
      <div class="gantt-info">
        <div class="gantt-task">${t.task}</div>
        <div class="gantt-meta">
          <span class="gantt-person" style="background:${p.bg};color:${p.txt}">${t.person}</span>
          <span class="gantt-sub">${t.sub}</span>
        </div>
      </div>
      <div class="gantt-timeline">
        ${bgCols}
        <div class="gantt-bar" style="left:calc(${left}% + 2px);width:calc(${width}% - 4px);background:${c.bar}">${label}</div>
      </div>
    </div>`;
  });

  document.getElementById('gantt-body').innerHTML = html;
}

/* ── 초기화 ───────────────────────────────────────────── */
renderFilters();
renderTable();
renderGantt();
</script>
</body>
</html>
